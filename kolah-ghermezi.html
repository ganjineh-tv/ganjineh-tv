
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آرشیو کلاه‌قرمزی | گنجینه نوستالژی</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f2f5fa;color:#172840}
header{background:#101d32;color:white;padding:17px}
header a{color:#f2c46d;text-decoration:none}
main{max-width:950px;margin:auto;padding:18px 13px 40px}
h1{font-size:24px}
p{line-height:2;color:#617187}
select,input,button{font:inherit;padding:11px;border-radius:9px}
input,select{border:1px solid #dce4ee;background:white;min-width:0}
input{width:100%;margin:10px 0}
.years{display:flex;gap:9px;flex-wrap:wrap}
button{border:0;background:#168b8d;color:white;cursor:pointer}
.years button.active{background:#f2c46d;color:#172840}
.episodes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.episode{background:white;border:1px solid #e0e7f0;border-radius:13px;padding:14px}
.episode strong{display:block;margin-bottom:12px;font-size:14px}
.episode select{width:100%;margin-bottom:8px}
.episode button{width:100%}
#player{display:none;margin-top:22px;background:#101d32;color:white;padding:15px;border-radius:14px}
video{width:100%;max-height:60vh;background:black;margin-top:12px}
.back{display:inline-block;margin-top:10px}
@media(max-width:500px){.episodes{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<a href="index.html">← بازگشت به گنجینه نوستالژی</a>
</header>
<main>
<h1>🧸 آرشیو کلاه‌قرمزی</h1>
<p>سال موردنظر رو انتخاب کن، قسمت رو پیدا کن و کیفیت پخش رو انتخاب کن.</p>

<div class="years">
<button class="active" onclick="showYear('88',this)">سال ۱۳۸۸</button>
<button onclick="showYear('90',this)">سال ۱۳۹۰</button>
</div>

<input id="search" type="search" placeholder="جست‌وجوی شماره قسمت..." oninput="render()">
<div id="episodes" class="episodes"></div>

<section id="player">
<strong id="playingTitle">پخش کلاه‌قرمزی</strong>
<video id="video" controls playsinline preload="metadata"></video>
<p id="status" style="color:white">اگر ویدئو پخش نشد، ممکن است لینک منبع در دسترس نباشد.</p>
<button onclick="closePlayer()">بستن پخش</button>
</section>
</main>

<script>
let year="88";

function showYear(y,btn){
year=y;
document.querySelectorAll(".years button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
render();
}

function makeUrl(ep,quality){
const prefix="Kolah.Ghermezi."+year;
const number=String(ep).padStart(2,"0");
return "https://dl3.ir-dl.com/series/"+prefix+"/"+quality+"p/"+prefix+"."+quality+"p.E"+number+".IR-DL.mp4";
}

function render(){
const total=year==="88"?15:16;
const q=document.getElementById("search").value.trim();
const box=document.getElementById("episodes");
box.innerHTML="";
for(let i=1;i<=total;i++){
if(q&&!String(i).includes(q))continue;
const card=document.createElement("div");
card.className="episode";
const title=document.createElement("strong");
title.textContent="کلاه‌قرمزی "+(year==="88"?"۱۳۸۸":"۱۳۹۰")+" — قسمت "+i;
const select=document.createElement("select");
select.setAttribute("aria-label","کیفیت پخش");
[["480","480p"],["720","720p"],["1080","1080p"]].forEach(([v,t])=>{
const option=document.createElement("option");
option.value=v;
option.textContent=t;
select.appendChild(option);
});
const button=document.createElement("button");
button.textContent="▶ پخش قسمت";
button.onclick=()=>playEpisode(i,select.value);
card.append(title,select,button);
box.appendChild(card);
}
}

function playEpisode(ep,quality){
const video=document.getElementById("video");
document.getElementById("playingTitle").textContent=
"کلاه‌قرمزی "+(year==="88"?"۱۳۸۸":"۱۳۹۰")+" — قسمت "+ep+" — "+quality+"p";
video.src=makeUrl(ep,quality);
document.getElementById("player").style.display="block";
document.getElementById("player").scrollIntoView({behavior:"smooth"});
video.play().catch(()=>{
document.getElementById("status").textContent=
"پخش خودکار انجام نشد؛ دکمهٔ پخش روی ویدئو رو بزن. اگر باز هم پخش نشد، لینک منبع ممکنه خراب یا غیرفعال باشه.";
});
}

function closePlayer(){
const video=document.getElementById("video");
video.pause();
video.removeAttribute("src");
video.load();
document.getElementById("player").style.display="none";
}

render();
</script>
</body>
</html>
