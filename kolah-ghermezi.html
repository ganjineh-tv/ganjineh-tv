<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آرشیو کلاه‌قرمزی | گنجینه نوستالژی</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f6fb;color:#172840}
header{background:#101d32;color:white;padding:17px}
a{color:#f2c46d;text-decoration:none}
main{max-width:950px;margin:auto;padding:18px 13px 40px}
h1{font-size:24px}
p{line-height:2;color:#627187}
.years{display:flex;gap:10px;flex-wrap:wrap}
button,select,input{font:inherit;padding:11px;border-radius:9px}
button{border:0;background:#168b8d;color:white;cursor:pointer}
.years button.active{background:#f2c46d;color:#172840}
input{width:100%;margin:16px 0;border:1px solid #dce4ee}
.episodes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.episode{background:white;border:1px solid #e0e7f0;border-radius:13px;padding:15px}
.episode strong{display:block;margin-bottom:12px}
.episode select,.episode button{width:100%;margin-top:8px}
#player{display:none;margin-top:24px;background:#101d32;color:white;padding:15px;border-radius:14px}
video{width:100%;background:black;margin-top:12px;max-height:60vh}
#status{color:white}
@media(max-width:500px){.episodes{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a href="index.html">← بازگشت به گنجینه نوستالژی</a></header>
<main>
<h1>🧸 آرشیو کلاه‌قرمزی</h1>
<p>سال و شمارهٔ قسمت رو انتخاب کن؛ سپس کیفیت پخش رو مشخص کن.</p>

<div class="years">
<button class="active" onclick="showYear('88',this)">سال ۱۳۸۸</button>
<button onclick="showYear('90',this)">سال ۱۳۹۰</button>
</div>

<input id="search" type="search" placeholder="جست‌وجوی شماره قسمت..." oninput="render()">
<div id="episodes" class="episodes"></div>

<section id="player">
<strong id="playingTitle">پخش کلاه‌قرمزی</strong>
<video id="video" controls playsinline preload="metadata"></video>
<p id="status">اگر ویدئو پخش نشد، ممکنه منبع در دسترس نباشه.</p>
<button onclick="closePlayer()">بستن پخش</button>
</section>
</main>

<script>
let year="88";

function showYear(y,btn){
year=y;
document.querySelectorAll(".years button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
render();
}

function makeUrl(ep,quality){
const prefix="Kolah.Ghermezi."+year;
const number=String(ep).padStart(2,"0");
return `https://dl3.ir-dl.com/series/${prefix}/${quality}p/${prefix}.${quality}p.E${number}.IR-DL.mp4`;
}

function render(){
const total=year==="88"?15:16;
const q=document.getElementById("search").value.trim();
const box=document.getElementById("episodes");
box.innerHTML="";

for(let i=1;i<=total;i++){
if(q&&!String(i).includes(q))continue;

const card=document.createElement("div");
card.className="episode";

const title=document.createElement("strong");
title.textContent=`کلاه‌قرمزی ${year==="88"?"۱۳۸۸":"۱۳۹۰"} — قسمت ${String(i).padStart(2,"0")}`;

const select=document.createElement("select");
select.setAttribute("aria-label","کیفیت پخش");

const qualities=year==="88"
?["480","720","1080"]
:["480","720","1080"];

qualities.forEach(quality=>{
const option=document.createElement("option");
option.value=quality;
option.textContent=quality+"p";
select.appendChild(option);
});

const play=document.createElement("button");
play.textContent="▶ پخش قسمت";
play.onclick=()=>playEpisode(i,select.value);

const link=document.createElement("a");
link.href=makeUrl(i,select.value);
link.target="_blank";
link.rel="noopener";
link.textContent="باز کردن لینک مستقیم";
link.style.cssText="display:block;margin-top:12px;font-size:12px";
select.onchange=()=>link.href=makeUrl(i,select.value);

card.append(title,select,play,link);
box.appendChild(card);
}
}

function playEpisode(ep,quality){
const video=document.getElementById("video");
video.pause();
video.src=makeUrl(ep,quality);

document.getElementById("playingTitle").textContent=
`کلاه‌قرمزی ${year==="88"?"۱۳۸۸":"۱۳۹۰"} — قسمت ${ep} — ${quality}p`;

document.getElementById("status").textContent=
"در حال بارگذاری ویدئو...";

document.getElementById("player").style.display="block";
document.getElementById("player").scrollIntoView({behavior:"smooth"});

video.play().catch(()=>{
document.getElementById("status").textContent=
"پخش خودکار انجام نشد؛ روی دکمهٔ پخش ویدئو بزن. اگر باز هم پخش نشد، ممکنه سرور لینک رو ارائه نکنه.";
});
}

function closePlayer(){
const video=document.getElementById("video");
video.pause();
video.removeAttribute("src");
video.load();
document.getElementById("player").style.display="none";
}

render();
</script>
</body>
</html>
