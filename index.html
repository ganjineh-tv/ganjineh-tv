<section id="kolahArchive" dir="rtl">
<style>
#kolahArchive{font-family:Tahoma;color:#fff9e9;background:#09271f;padding:20px;border-radius:18px}
#kolahArchive h2{color:#f1d18b}
#kolahArchive button,#kolahArchive select{padding:11px;margin:5px;border-radius:9px;border:1px solid #d8ad5b;background:#12382e;color:white}
#kolahArchive .episode{padding:15px;margin:12px 0;background:#12382e;border:1px solid #315648;border-radius:12px}
#kolahArchive video{width:100%;max-height:420px;background:#000;border-radius:12px;margin-top:12px}
#kolahArchive .quality{background:#d8ad5b;color:#17251c;font-weight:bold}
</style>

<h2>🎭 آرشیو کلاه‌قرمزی</h2>
<p>ایرانیان دانلود | انتخاب سال، قسمت و کیفیت</p>

<label for="kolahYear">انتخاب مجموعه:</label>
<select id="kolahYear" onchange="loadKolahEpisode()">
<option value="88">کلاه‌قرمزی ۱۳۸۸</option>
<option value="90">کلاه‌قرمزی ۱۳۹۰</option>
</select>

<div class="episode">
<h3 id="kolahTitle">کلاه‌قرمزی ۱۳۸۸ - قسمت ۱</h3>
<label for="kolahQuality">کیفیت:</label>
<select id="kolahQuality" onchange="loadKolahEpisode()">
<option value="480p">480p</option>
<option value="720p">720p</option>
<option value="1080p">1080p</option>
</select>
<button class="quality" onclick="playKolah()">▶ پخش آنلاین</button>
<video id="kolahVideo" controls playsinline preload="none"></video>
<p id="kolahStatus">برای شروع پخش، کیفیت را انتخاب و روی پخش آنلاین بزن.</p>
<a id="kolahDownload" href="#" target="_blank" rel="noopener">دریافت مستقیم فایل</a>
</div>

<script>
function getKolahUrl(){
 const year=document.getElementById("kolahYear").value;
 const quality=document.getElementById("kolahQuality").value;
 return `https://dl3.ir-dl.com/series/Kolah.Ghermezi.${year}/${quality}/Kolah.Ghermezi.${year}.${quality}.E01.IR-DL.mp4`;
}
function loadKolahEpisode(){
 const year=document.getElementById("kolahYear").value;
 document.getElementById("kolahTitle").textContent=
  `کلاه‌قرمزی ۱۳${year} - قسمت ۱`;
 const video=document.getElementById("kolahVideo");
 video.pause();
 video.removeAttribute("src");
 video.load();
 document.getElementById("kolahDownload").href=getKolahUrl();
 document.getElementById("kolahStatus").textContent="کیفیت انتخاب شد؛ برای پخش کلیک کن.";
}
function playKolah(){
 const video=document.getElementById("kolahVideo");
 const url=getKolahUrl();
 video.src=url;
 video.load();
 video.play().then(()=>{
  document.getElementById("kolahStatus").textContent="در حال پخش قسمت اول";
 }).catch(()=>{
  document.getElementById("kolahStatus").textContent=
   "پخش مستقیم ممکن نشد؛ از لینک دریافت مستقیم فایل استفاده کن.";
 });
 document.getElementById("kolahDownload").href=url;
}
</script>
</section>
