<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گنجینه نوستالژی | آرشیو کلاه‌قرمزی</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08111f;color:#fff;font-family:Tahoma,Arial,sans-serif}
header{padding:22px 16px;background:#111e30;text-align:center;border-bottom:2px solid #e52b4b}
header h1{margin:0;color:#ff526b;font-size:25px}
header p{color:#cbd5e1;margin-bottom:0}
main{max-width:1100px;margin:auto;padding:18px}
h2{color:#ff657a}
#search{width:100%;padding:13px;border-radius:10px;border:1px solid #526176;background:#152238;color:white;font-size:16px;margin-bottom:20px}
.year{margin:28px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.card{background:#152238;border:1px solid #263951;border-radius:12px;padding:14px;text-align:center}
.thumb{height:90px;background:linear-gradient(135deg,#283e5c,#101827);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:38px;margin-bottom:10px}
.card h3{font-size:15px;margin:8px 0}
button,select{padding:10px;border:0;border-radius:8px;background:#e52b4b;color:white;font-size:14px;cursor:pointer}
select{width:100%;margin:8px 0;background:#263951}
.play{width:100%}
#playerBox{display:none;background:#152238;padding:14px;border-radius:12px;margin:20px 0}
video{width:100%;max-height:65vh;background:#000;border-radius:8px}
#playerTitle{font-size:18px;color:#ff657a}
.note{color:#b8c4d6;font-size:13px;line-height:1.8}
footer{text-align:center;padding:25px;color:#9aabc0}
</style>
</head>
<body>
<header>
<h1>📺 گنجینه نوستالژی</h1>
<p>آرشیو خاطرات کودکی | کلاه‌قرمزی</p>
</header>
<main>
<input id="search" placeholder="جست‌وجوی سال یا شماره قسمت..." oninput="render()">
<div id="playerBox">
<h2 id="playerTitle">پخش ویدئو</h2>
<video id="video" controls playsinline preload="metadata"></video>
<p class="note">اگر ویدئو پخش نشد، کیفیت دیگری را انتخاب کن یا لینک را در مرورگر باز کن.</p>
</div>
<div id="catalog"></div>
</main>
<footer>گنجینه نوستالژی 🎞️</footer>
<script>
const years=[
 {year:1388,count:15,folder:"88"},
 {year:1390,count:16,folder:"90"}
];
function url(year,ep,quality){
 const n=String(ep).padStart(2,"0");
 return `https://dl3.ir-dl.com/series/Kolah.Ghermezi.${year.folder}/${quality}p/Kolah.Ghermezi.${year.folder}.${quality}p.E${n}.IR-DL.mp4`;
}
function render(){
 const q=document.getElementById("search").value.trim();
 const root=document.getElementById("catalog");
 root.innerHTML="";
 years.forEach(y=>{
  const episodes=[];
  for(let i=1;i<=y.count;i++){
   const title=`کلاه‌قرمزی ${y.year} - قسمت ${String(i).padStart(2,"0")}`;
   if(!q||title.includes(q)||String(y.year).includes(q)||String(i).includes(q)){
    episodes.push({i,title});
   }
  }
  if(!episodes.length)return;
  const section=document.createElement("section");
  section.className="year";
  const heading=document.createElement("h2");
  heading.textContent=`🎩 آرشیو کلاه‌قرمزی ${y.year}`;
  section.appendChild(heading);
  const grid=document.createElement("div");
  grid.className="grid";
  episodes.forEach(ep=>{
   const card=document.createElement("article");
   card.className="card";
   const thumb=document.createElement("div");
   thumb.className="thumb";
   thumb.textContent="🎬";
   const h=document.createElement("h3");
   h.textContent=ep.title;
   const select=document.createElement("select");
   ["480","720","1080"].forEach(quality=>{
    const opt=document.createElement("option");
    opt.value=quality;
    opt.textContent=quality+"p";
    select.appendChild(opt);
   });
   const button=document.createElement("button");
   button.className="play";
   button.textContent="▶ پخش قسمت";
   button.onclick=()=>{
    const box=document.getElementById("playerBox");
    const video=document.getElementById("video");
    document.getElementById("playerTitle").textContent=ep.title+" ("+select.value+"p)";
    box.style.display="block";
    video.pause();
    video.src=url(y,ep.i,select.value);
    video.load();
    box.scrollIntoView({behavior:"smooth",block:"start"});
    video.play().catch(()=>{});
   };
   card.append(thumb,h,select,button);
   grid.appendChild(card);
  });
  section.appendChild(grid);
  root.appendChild(section);
 });
}
render();
</script>
</body>
</html>
